[package]
name = "octoshell"
version = "0.1.0"
description = "OctoShell — a power-user terminal workspace"
authors = ["OctoShell"]
edition = "2021"
rust-version = "1.77"

# The library is what Tauri's mobile/desktop entrypoints link against.
[lib]
name = "octoshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Server-side AI calls; rustls avoids a system OpenSSL dependency on Windows.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Optional Docker sandbox for agent commands (docker.rs). bollard's default
# features use rustls (not system OpenSSL), so they're consistent with our
# Windows-friendly, OpenSSL-free stack; they also provide connect_with_local_defaults.
bollard = "0.18"
futures-util = "0.3"

# Agent Client Protocol (ACP): the provider-agnostic path. OctoShell acts as an
# ACP CLIENT that drives any ACP-speaking agent (Claude, Gemini, …) over a
# subprocess. See acp.rs. tokio is needed directly for the async session tasks
# and prompt/decision channels.
agent-client-protocol = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "process", "time"] }

# Win32 Job Object: tie every spawned shell/agent to OctoShell's lifetime so a
# crash or hot-reload can't orphan pwsh/claude/gemini processes (see jobctl.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
