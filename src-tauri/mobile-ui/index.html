<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#292D3E" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>OctoShell</title>
<style>
  /* One file, no build step, no CDN. The page is served from the user's own
     machine through a tunnel, so every extra origin would be another thing that
     can fail on a phone with bad signal — and another thing to trust. */
  :root {
    --ink: #292D3E; --panel: #252A3A; --edge: #3A3F58;
    --accent: #7E57C2; --muted: #8087A8; --text: #E6E9F5;
    --ok: #34D399; --bad: #F87171; --warn: #FBBF24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--ink);
    border-bottom: 1px solid var(--edge); padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .sp { margin-left: auto; }
  main { padding: 12px 16px 40px; }
  button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--edge); border-radius: 10px; padding: 10px 14px;
    /* 44px is the smallest reliably tappable target; approvals get pressed in a
       hurry, often one-handed. */
    min-height: 44px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  /* A disabled button that still looks pressable is a trap: you tap it, nothing
     happens, and you cannot tell whether the tap or the app is broken. */
  button:disabled { opacity: .45; cursor: default; }
  textarea:disabled { opacity: .6; }
  button.ok { background: rgba(52,211,153,.15); border-color: rgba(52,211,153,.5); color: var(--ok); }
  button.bad { background: rgba(248,113,113,.15); border-color: rgba(248,113,113,.5); color: var(--bad); }
  input {
    font: 20px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .3em;
    text-align: center; text-transform: uppercase;
    width: 100%; padding: 14px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--edge); color: var(--text);
  }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .card.urgent { border-color: var(--warn); background: rgba(251,191,36,.07); }
  .row { display: flex; align-items: center; gap: 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .tiny { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--edge); }
  .dot.busy { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  pre {
    margin: 8px 0 0; padding: 10px; background: #0008; border-radius: 8px;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow: auto;
  }
  .err { color: var(--bad); font-size: 13px; margin-top: 10px; }
  .center { text-align: center; }
  .stack > * + * { margin-top: 10px; }
  /* A flex child will not shrink below its content unless told to, which is how
     a long repo name pushes the timestamp off a 390px screen. */
  .grow { flex: 1; min-width: 0; }
  .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The overflow menu. Three labelled buttons never fit beside the title on a
     phone, and shrinking them makes them unreadable AND untappable. */
  .menu {
    position: absolute; top: 100%; right: 10px; z-index: 6;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
    padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 170px;
    box-shadow: 0 12px 28px #0007;
  }
  .menu button { width: 100%; text-align: left; border: none; background: none; border-radius: 8px; }
  .chip {
    font-size: 12px; padding: 6px 12px; border-radius: 999px; min-height: 0;
    border: 1px solid var(--edge); background: var(--panel); color: var(--muted);
  }
  .chip.on { border-color: var(--accent); color: var(--text); background: rgba(126,87,194,.18); }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <button id="back" style="display:none;padding:6px 11px;min-height:36px">←</button>
  <span style="font-size:18px">🐙</span>
  <h1 class="clip">OctoShell</h1>
  <span class="sp"></span>
  <button id="more" style="display:none;padding:6px 12px;min-height:36px">⋯</button>
</header>
<main id="app"></main>

<script>
(() => {
  "use strict";
  const app = document.getElementById("app");
  const backBtn = document.getElementById("back");
  const KEY = "octoshell.mobile.token";

  let token = null;
  try { token = localStorage.getItem(KEY); } catch { /* private mode */ }
  let view = { name: "projects" };
  // Whether OctoShell allows tasks from here at all. The phone only uses this to
  // decide what to show; the refusal that counts happens on the machine.
  let canDispatch = false;
  let poll = null;

  const el = (tag, props = {}, ...kids) => {
    const n = Object.assign(document.createElement(tag), props);
    for (const k of kids.flat()) n.append(k?.nodeType ? k : document.createTextNode(String(k)));
    return n;
  };
  const moreBtn = document.getElementById("more");
  // Alerts, Install and Sign out are all rare, and all three lost their fight
  // with the title in the header: "Sign out" wrapped onto two lines at 390px.
  // They live in an overflow menu now and keep their full labels.
  const outBtn = el("button", {}, "Sign out");
  const installBtn = el("button", { style: "display:none" }, "Install");
  const notifyBtn = el("button", { style: "display:none" }, "🔔 Alerts");
  const menu = el("div", { className: "menu", style: "display:none" }, notifyBtn, installBtn, outBtn);
  const closeMenu = () => { menu.style.display = "none"; };
  const menuHasAnything = () =>
    [notifyBtn, installBtn, outBtn].some((b) => b.style.display !== "none");
  document.querySelector("header").append(menu);
  moreBtn.onclick = (e) => {
    e.stopPropagation();
    menu.style.display = menu.style.display === "none" ? "flex" : "none";
  };
  // Tapping anywhere else dismisses it, which is how every menu on a phone is
  // expected to behave.
  document.addEventListener("click", closeMenu);
  menu.addEventListener("click", closeMenu);

  const ago = (ms) => {
    if (!ms) return "";
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return s + "s ago";
    if (s < 3600) return Math.round(s / 60) + "m ago";
    return Math.round(s / 3600) + "h ago";
  };

  async function api(path, opts = {}) {
    const r = await fetch(path, {
      ...opts,
      headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}), ...(opts.headers || {}) },
    });
    if (r.status === 401 || r.status === 410) {
      // The share ended or the token died. Drop it and go back to the code
      // screen rather than leaving a dead UI that keeps failing silently.
      signOut();
      throw new Error("This share has ended. Ask for a new code.");
    }
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || ("request failed (" + r.status + ")"));
    return body;
  }

  function signOut() {
    token = null;
    try { localStorage.removeItem(KEY); } catch {}
    view = { name: "projects" };
    stopPolling();
    render();
  }

  function stopPolling() { if (poll) { clearInterval(poll); poll = null; } }

  // ---------- screens ----------

  function loginScreen(error) {
    const input = el("input", { id: "code", autocomplete: "one-time-code", inputMode: "text", placeholder: "CODE" });
    const go = el("button", { className: "primary", style: "width:100%" }, "Connect");
    const box = el("div", { className: "stack" },
      el("p", { className: "muted center" }, "Enter the code shown in OctoShell on your computer."),
      input, go);
    if (error) box.append(el("p", { className: "err center" }, error));
    go.onclick = async () => {
      const code = input.value.trim();
      if (!code) return;
      go.disabled = true; go.textContent = "Connecting…";
      try {
        const r = await api("/api/auth", { method: "POST", body: JSON.stringify({ code }) });
        token = r.token;
        try { localStorage.setItem(KEY, token); } catch {}
        render();
      } catch (e) {
        go.disabled = false; go.textContent = "Connect";
        render(String(e.message || e));
      }
    };
    input.onkeydown = (e) => { if (e.key === "Enter") go.click(); };
    app.replaceChildren(box);
    input.focus();
  }

  // A signature of what the list currently shows, so a poll that found nothing
  // new touches no DOM at all.
  let listSignature = null;

  async function projectsScreen(opts = {}) {
    const silent = opts.silent === true;
    const wrap = el("div", { className: "stack" });
    const hint = iosHint();
    if (hint) wrap.append(hint);
    // "Loading…" belongs to a screen you asked for, never to a background poll:
    // wiping what you are reading every few seconds is worse than showing data
    // that is a moment stale.
    if (!silent) app.replaceChildren(el("p", { className: "muted" }, "Loading…"));
    try {
      // Approvals first, always: a blocked agent is the only thing here that is
      // costing time right now.
      const [ap, pr, st] = await Promise.all([
        api("/api/approvals"),
        api("/api/projects"),
        // Cheap, and it is the only warning you get before the share simply
        // stops working mid-task.
        api("/api/status").catch(() => null),
      ]);
      // Only what is actually rendered. Block counts and busy flags change
      // constantly while an agent works; including anything finer would put us
      // straight back to redrawing every few seconds.
      const signature = JSON.stringify([
        (ap.approvals || []).map((a) => a.requestId),
        (pr.projects || []).map((p) => [p.id, p.name, p.agentBusy, p.blocks]),
        pr.orchestratorThinking,
        expiryLabel(st),
      ]);
      canDispatch = pr.canDispatch === true;
      if (ap.approvals?.length) {
        wrap.append(el("p", { className: "tiny" }, "Waiting for you"));
        for (const a of ap.approvals) wrap.append(approvalCard(a));
      }
      // Above the projects, because it is the thing that COMMANDS them: from a
      // phone, "tell the orchestrator what you want" is almost always the move,
      // and picking the right project yourself is the fallback.
      const orch = el("div", { className: "card" },
        el("div", { className: "row" },
          el("strong", { className: "grow clip" }, "🧠 Orchestrator"),
          el("span", { className: "muted" }, pr.orchestratorThinking ? "thinking" : "")),
        el("p", { className: "muted", style: "margin:6px 0 0" }, "Talk to the one that runs the others."));
      orch.onclick = () => { view = { name: "orchestrator" }; render(); };
      wrap.append(el("p", { className: "tiny", style: "margin-top:18px" }, "Command"));
      wrap.append(orch);
      wrap.append(el("p", { className: "tiny", style: "margin-top:18px" }, "Projects"));
      if (!pr.projects?.length) wrap.append(el("p", { className: "muted" }, "No projects open."));
      for (const p of pr.projects || []) {
        const card = el("div", { className: "card" },
          el("div", { className: "row" },
            el("span", { className: "dot" + (p.agentBusy ? " busy" : "") }),
            el("strong", { className: "grow clip" }, p.name),
            el("span", { className: "muted", style: "flex:none" }, p.agentBusy ? "working" : ago(p.lastAt))),
          el("p", { className: "muted", style: "margin:6px 0 0" }, p.blocks + " entries"));
        card.onclick = () => { view = { name: "feed", id: p.id, name2: p.name }; render(); };
        wrap.append(card);
      }
      const expiry = expiryLabel(st);
      if (expiry) {
        wrap.append(el("p", {
          className: expiry.soon ? "err" : "muted",
          style: "margin-top:18px;text-align:center",
        }, expiry.text));
      }
      // Nothing changed: leave the DOM, the scroll position and any half-pressed
      // button exactly as they are.
      if (silent && signature === listSignature) return;
      listSignature = signature;
      const y = window.scrollY;
      app.replaceChildren(wrap);
      // Replacing content resets scroll, and a poll must not throw you back to
      // the top while you are reading further down.
      if (silent) window.scrollTo(0, y);
    } catch (e) {
      // A failed poll must not blank the screen either — only a screen you asked
      // for gets to show an error in place of content.
      if (!silent) app.replaceChildren(el("p", { className: "err" }, String(e.message || e)));
    }
  }

  /** How long this share has left, or null when the server did not say.
   *
   *  Worth showing because the failure it predicts is confusing: the share ends
   *  on a timer, and without warning the phone just starts refusing everything
   *  in the middle of whatever you were doing. */
  function expiryLabel(st) {
    const at = st && st.expiresAt;
    if (!at) return null;
    const left = at - Date.now();
    if (left <= 0) return { text: "Access has expired.", soon: true };
    const mins = Math.ceil(left / 60000);
    if (mins <= 5) return { text: "Access ends in " + mins + " min", soon: true };
    if (mins < 60) return { text: "Access ends in " + mins + " min", soon: false };
    return { text: "Access ends in " + Math.round(mins / 60) + "h", soon: false };
  }

  function approvalCard(a) {
    const card = el("div", { className: "card urgent" },
      el("div", { className: "row" }, el("strong", {}, a.tool), el("span", { className: "muted", style: "margin-left:auto" }, a.projectName)),
      el("pre", {}, a.input || ""));
    const deny = el("button", { className: "bad", style: "flex:1" }, "Deny");
    const allow = el("button", { className: "ok", style: "flex:1" }, "Approve");
    const decide = async (v, btn) => {
      deny.disabled = allow.disabled = true;
      btn.textContent = "…";
      try { await api("/api/approve", { method: "POST", body: JSON.stringify({ requestId: a.requestId, allow: v }) }); render(); }
      catch (e) { card.append(el("p", { className: "err" }, String(e.message || e))); deny.disabled = allow.disabled = false; }
    };
    deny.onclick = () => decide(false, deny);
    allow.onclick = () => decide(true, allow);
    card.append(el("div", { className: "row", style: "margin-top:10px" }, deny, allow));
    return card;
  }

  async function feedScreen(id, name, before) {
    app.replaceChildren(el("p", { className: "muted" }, "Loading…"));
    try {
      const q = "/api/session?id=" + encodeURIComponent(id) + "&limit=20" + (before != null ? "&before=" + before : "");
      const d = await api(q);
      const wrap = el("div", { className: "stack" }, el("p", { className: "tiny" }, name));
      if (d.nextBefore != null) {
        const more = el("button", { style: "width:100%" }, "Load older");
        more.onclick = () => feedScreen(id, name, d.nextBefore);
        wrap.append(more);
      }
      for (const b of d.blocks || []) wrap.append(blockCard(b));
      if (!d.blocks?.length) wrap.append(el("p", { className: "muted" }, "Nothing here yet."));
      if (canDispatch) wrap.append(taskBox(id, name));
      app.replaceChildren(wrap);
    } catch (e) {
      app.replaceChildren(el("p", { className: "err" }, String(e.message || e)));
    }
  }

  /** Send a follow-up to this project's agent. Kept at the BOTTOM of the feed,
   *  under what the agent just said: on a phone the useful task is almost always
   *  a reply to what you're reading, not a fresh instruction typed blind. */
  function taskBox(id, name) {
    const input = el("textarea", {
      rows: 3,
      placeholder: "Send a task to " + name + "…",
      style:
        "width:100%;font:inherit;letter-spacing:normal;text-align:left;text-transform:none;" +
        "background:var(--panel);border:1px solid var(--edge);border-radius:10px;color:var(--text);padding:10px",
    });
    const send = el("button", { className: "primary", style: "width:100%;margin-top:8px" }, "Send");
    const box = el("div", { className: "card" }, input, send);
    send.onclick = async () => {
      const prompt = input.value.trim();
      if (!prompt) return;
      send.disabled = true;
      send.textContent = "Sending…";
      try {
        await api("/api/dispatch", { method: "POST", body: JSON.stringify({ projectId: id, prompt }) });
        input.value = "";
        // Straight back to the feed so you see the task land, rather than a
        // success message that tells you nothing about what happens next.
        feedScreen(id, name, null);
      } catch (e) {
        send.disabled = false;
        send.textContent = "Send";
        box.append(el("p", { className: "err" }, String(e.message || e)));
      }
    };
    return box;
  }

  // A signature for the orchestrator chat, same reasoning as the project list:
  // a poll that found nothing new must not touch the DOM.
  let orchSignature = null;
  // Whether the chat picker is expanded. Collapsed by default so the messages,
  // which are why you opened the screen, stay at the top.
  let chatsOpen = false;

  async function orchestratorScreen(opts = {}) {
    const silent = opts.silent === true;
    if (!silent) app.replaceChildren(el("p", { className: "muted" }, "Loading…"));
    try {
      const d = await api("/api/orchestrator");
      const signature = JSON.stringify([d.messages, d.thinking, d.canSend, d.chats, chatsOpen]);
      if (silent && signature === orchSignature) return;
      orchSignature = signature;

      const wrap = el("div", { className: "stack" });
      wrap.append(chatBar(d));
      if (d.truncated) {
        wrap.append(el("p", { className: "muted tiny" }, "Showing the latest messages only."));
      }
      for (const m of d.messages || []) {
        wrap.append(el("div", { className: "card" },
          el("span", { className: "tiny" }, m.role === "user" ? "You" : "Orchestrator"),
          el("div", { style: "margin-top:6px;white-space:pre-wrap" }, m.content)));
      }
      if (!d.messages?.length) wrap.append(el("p", { className: "muted" }, "Nothing said yet."));
      // Shown while a turn is in flight so a silent reply never looks like a
      // dropped message — the one question a phone cannot answer by looking.
      if (d.thinking) {
        const stop = el("button", { className: "bad", style: "width:100%" }, "Stop this turn");
        stop.onclick = async () => {
          stop.disabled = true;
          stop.textContent = "Stopping…";
          try { await api("/api/orchestrator/stop", { method: "POST", body: "{}" }); }
          catch (e) { stop.textContent = String(e.message || e); return; }
          orchSignature = null;
          void orchestratorScreen();
        };
        wrap.append(el("div", { className: "card" },
          el("p", { className: "muted", style: "margin:0 0 8px" }, "Thinking…"),
          d.canSend ? stop : ""));
      }
      if (d.canSend) wrap.append(orchBox(d.thinking));

      const y = window.scrollY;
      app.replaceChildren(wrap);
      // A fresh screen belongs at the newest message; a poll must leave you
      // where you were reading.
      if (silent) window.scrollTo(0, y);
      else window.scrollTo(0, document.body.scrollHeight);
    } catch (e) {
      if (!silent) app.replaceChildren(el("p", { className: "err" }, String(e.message || e)));
    }
  }

  /** Which conversation you are in, and how to change it.
   *
   *  Collapsed to one line until tapped: the orchestrator keeps every chat it
   *  has ever had, and a phone screen full of old titles buries the one thing
   *  you came for. */
  function chatBar(d) {
    const chats = d.chats || [];
    const active = chats.find((c) => c.active);
    // Normal case, not the uppercase .tiny label style: this is the name of the
    // conversation you are reading, not a section heading, and a title shouted
    // in capitals is harder to scan than the messages under it.
    const head = el("div", { className: "row" },
      el("span", { className: "muted grow clip" }, active ? active.title : "Orchestrator"));
    const box = el("div", { className: "card" }, head);
    if (!d.canSend) return box;

    const toggle = el("button", { className: "chip" }, chatsOpen ? "Close" : "Chats");
    toggle.onclick = (e) => {
      e.stopPropagation();
      chatsOpen = !chatsOpen;
      orchSignature = null;
      void orchestratorScreen();
    };
    head.append(toggle);

    if (!chatsOpen) return box;

    const list = el("div", { className: "bar", style: "margin-top:10px" });
    for (const c of chats) {
      const chip = el("button", { className: "chip" + (c.active ? " on" : "") }, c.title || "Untitled");
      chip.onclick = async () => {
        if (c.active) { chatsOpen = false; orchSignature = null; return void orchestratorScreen(); }
        chip.disabled = true;
        try { await api("/api/orchestrator/chat", { method: "POST", body: JSON.stringify({ chatId: c.id }) }); }
        catch (e) { chip.disabled = false; return void box.append(el("p", { className: "err" }, String(e.message || e))); }
        chatsOpen = false;
        orchSignature = null;
        void orchestratorScreen();
      };
      list.append(chip);
    }
    const fresh = el("button", { className: "chip" }, "+ New chat");
    fresh.onclick = async () => {
      fresh.disabled = true;
      try { await api("/api/orchestrator/chat", { method: "POST", body: JSON.stringify({ fresh: true }) }); }
      catch (e) { fresh.disabled = false; return void box.append(el("p", { className: "err" }, String(e.message || e))); }
      chatsOpen = false;
      orchSignature = null;
      void orchestratorScreen();
    };
    list.append(fresh);
    box.append(list);
    return box;
  }

  /** The composer for the orchestrator chat. */
  function orchBox(thinking) {
    const input = el("textarea", {
      rows: 3,
      placeholder: thinking ? "Waiting for the current turn…" : "Tell the orchestrator what you want…",
      disabled: thinking,
      style:
        "width:100%;font:inherit;letter-spacing:normal;text-align:left;text-transform:none;" +
        "background:var(--panel);border:1px solid var(--edge);border-radius:10px;color:var(--text);padding:10px",
    });
    const send = el("button", { className: "primary", style: "width:100%;margin-top:8px" }, "Send");
    send.disabled = thinking;
    const box = el("div", { className: "card" }, input, send);
    send.onclick = async () => {
      const text = input.value.trim();
      if (!text) return;
      send.disabled = true;
      send.textContent = "Sending…";
      try {
        await api("/api/orchestrator/send", { method: "POST", body: JSON.stringify({ text }) });
        input.value = "";
        // Force a redraw: the reply lands seconds later, and the signature from
        // before the send would otherwise suppress the first poll that sees it.
        orchSignature = null;
        void orchestratorScreen();
      } catch (e) {
        send.disabled = false;
        send.textContent = "Send";
        box.append(el("p", { className: "err" }, String(e.message || e)));
      }
    };
    return box;
  }

  function blockCard(b) {
    if (b.kind === "command") {
      return el("div", { className: "card" },
        el("div", { className: "row" },
          el("span", {}, b.status === "error" ? "✗" : "$"),
          el("strong", { style: "font-family:ui-monospace,monospace;font-size:13px" }, b.command),
          el("span", { className: "muted", style: "margin-left:auto" }, ago(b.at))),
        b.output ? el("pre", {}, b.output) : "");
    }
    if (b.kind === "agentText") {
      return el("div", { className: "card" },
        el("div", { className: "row" },
          el("span", { className: "tiny" }, b.role === "user" ? (b.via === "phone" ? "You 📱" : "You") : "Agent"),
          el("span", { className: "muted", style: "margin-left:auto" }, ago(b.at))),
        el("p", { style: "margin:6px 0 0;white-space:pre-wrap" }, b.text || ""));
    }
    if (b.kind === "agentTool") {
      return el("div", { className: "card" },
        el("div", { className: "row" }, el("span", { className: "muted" }, "🔧 " + b.tool), el("span", { className: "muted", style: "margin-left:auto" }, b.status || "")),
        b.input ? el("pre", {}, b.input) : "");
    }
    return el("div", { className: "card muted" }, b.kind);
  }

  // ---------- routing ----------

  function render(loginError) {
    stopPolling();
    // A screen you asked for always draws, whatever the last poll cached.
    listSignature = null;
    orchSignature = null;
    closeMenu();
    const authed = !!token;
    backBtn.style.display = authed && view.name !== "projects" ? "" : "none";
    if (!authed) installBtn.style.display = "none";
    void refreshAlertButton();
    outBtn.style.display = authed ? "" : "none";
    // No menu button when the menu would be empty (signed out, nothing to show).
    moreBtn.style.display = authed && menuHasAnything() ? "" : "none";
    if (!authed) return loginScreen(loginError);
    if (view.name === "feed") return feedScreen(view.id, view.name2, null);
    if (view.name === "orchestrator") {
      void orchestratorScreen();
      // This one DOES poll while open, unlike a project feed: you are waiting on
      // a reply here, and the reply is the entire point of the screen.
      poll = setInterval(() => {
        if (view.name === "orchestrator" && document.visibilityState === "visible") {
          void orchestratorScreen({ silent: true });
        }
      }, 5000);
      return;
    }
    projectsScreen();
    // Only the list polls. A feed you are reading must not reshuffle under your
    // thumb; you pull back to the list to refresh it.
    poll = setInterval(() => {
      if (view.name === "projects" && document.visibilityState === "visible") {
        void projectsScreen({ silent: true });
      }
    }, 5000);
  }

  backBtn.onclick = () => { view = { name: "projects" }; render(); };
  outBtn.onclick = signOut;
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !token) return;
    if (view.name === "projects") void projectsScreen({ silent: true });
    if (view.name === "orchestrator") void orchestratorScreen({ silent: true });
  });

  // ---------- notifications ----------
  //
  // Web Push is the only way to reach a phone while the app is closed without
  // installing a second app. The message is encrypted end to end: the browser
  // publishes a key when it subscribes, OctoShell encrypts with it, and the push
  // service in between can see that something arrived but never what.
  const b64ToBytes = (s) => {
    const pad = s.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(pad + "=".repeat((4 - (pad.length % 4)) % 4));
    return Uint8Array.from(bin, (c) => c.charCodeAt(0));
  };
  const bytesToB64 = (buf) =>
    btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

  async function enableAlerts() {
    notifyBtn.disabled = true;
    try {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        throw new Error("This browser can't do notifications here. Over plain HTTP on a local address, no browser can — that needs HTTPS.");
      }
      const permission = await Notification.requestPermission();
      if (permission !== "granted") throw new Error("Notifications were not allowed.");
      const reg = await navigator.serviceWorker.ready;
      const { key } = await api("/api/push/key");
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: b64ToBytes(key),
      });
      const raw = sub.toJSON ? sub.toJSON() : null;
      await api("/api/push/subscribe", {
        method: "POST",
        body: JSON.stringify({
          endpoint: sub.endpoint,
          p256dh: raw?.keys?.p256dh ?? bytesToB64(sub.getKey("p256dh")),
          auth: raw?.keys?.auth ?? bytesToB64(sub.getKey("auth")),
        }),
      });
      notifyBtn.textContent = "🔔 On";
      notifyBtn.disabled = true;
    } catch (e) {
      notifyBtn.disabled = false;
      alert(String(e.message || e));
    }
  }
  notifyBtn.onclick = enableAlerts;

  async function refreshAlertButton() {
    if (!token) { notifyBtn.style.display = "none"; return; }
    // Hidden where it cannot work — over plain HTTP there is no service worker,
    // and a button that always errors is worse than no button.
    const possible = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    notifyBtn.style.display = possible ? "" : "none";
    // The check is async, so the button may become available after render()
    // already decided whether the menu was worth showing.
    moreBtn.style.display = token && menuHasAnything() ? "" : "none";
    if (!possible) return;
    try {
      const reg = await navigator.serviceWorker.ready;
      const existing = await reg.pushManager.getSubscription();
      if (existing && Notification.permission === "granted") {
        notifyBtn.textContent = "🔔 On";
        notifyBtn.disabled = true;
      } else {
        notifyBtn.textContent = "🔔 Alerts";
        notifyBtn.disabled = false;
      }
    } catch { /* leave it offering */ }
  }

  // ---------- install to the home screen ----------
  //
  // Chrome fires beforeinstallprompt and lets us show our own button, which is
  // the whole point: one tap instead of hunting through a menu. Safari has no
  // such API at all, so iOS gets the instruction once rather than a button that
  // would do nothing.
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "";
  });
  installBtn.onclick = async () => {
    if (!deferredPrompt) return;
    installBtn.disabled = true;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice.catch(() => {});
    deferredPrompt = null;
    installBtn.style.display = "none";
  };
  window.addEventListener("appinstalled", () => { installBtn.style.display = "none"; });

  function iosHint() {
    const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
    const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
    if (!isIOS || standalone) return null;
    try { if (localStorage.getItem("octoshell.iosHint") === "seen") return null; } catch {}
    const bar = el("div", { className: "card", style: "border-color:var(--accent)" },
      el("p", { style: "margin:0" }, "Add to Home Screen: tap Share, then “Add to Home Screen”."));
    const dismiss = el("button", { style: "margin-top:8px;width:100%" }, "Got it");
    dismiss.onclick = () => { try { localStorage.setItem("octoshell.iosHint", "seen"); } catch {} bar.remove(); };
    bar.append(dismiss);
    return bar;
  }

  // Registered only for installability — it caches nothing on purpose.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }

  render();
})();
</script>
</body>
</html>
