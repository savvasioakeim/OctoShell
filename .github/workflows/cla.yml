name: CLA Assistant

# Requires PRs to sign the Contributor License Agreement (CLA.md) before they can
# be merged. The bot comments on each PR, records signatures in
# signatures/cla.json (on the main branch), and sets a PR status check.
#
# SETUP (one time):
#   1. Create a FINE-GRAINED personal access token:
#        Repository access → Only select repositories → OctoShell
#        Permissions → Repository permissions → Contents: Read and write
#      Nothing else. Do NOT use a classic token with `repo` scope: classic tokens
#      are account-wide, so a leak reaches every repository you own, while this
#      job only ever needs to append one JSON file in this one repo.
#   2. Add it as a repo secret named CLA_SIGNATURES_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#   3. Set an expiry and diarise the renewal — the CLA check fails closed when
#      the token dies, which blocks merges until it is replaced.
# The built-in GITHUB_TOKEN cannot push the signatures file, hence the PAT.
#
# SAFETY NOTE: this workflow runs on `pull_request_target`, which executes with
# the BASE repo's secrets even for pull requests from forks. That is only safe
# because it never checks out or runs the PR's code — the action just reads the
# event payload and writes the signatures file. If you ever add
# `actions/checkout` with the PR's ref to this job, a fork PR can run arbitrary
# code with the token above. Don't.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the COMMIT behind v2.6.1, not the tag. A tag is a movable
        # pointer: whoever can push to that repository can repoint it at other
        # code, which would then run here with the token below (Contents: write
        # on THIS repo). A commit SHA cannot be repointed. Re-pin deliberately
        # when upgrading, and read the diff first.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/savvasioakeim/OctoShell/blob/main/CLA.md'
          # NOT main: main is protected (changes must go through a pull request)
          # and this action commits the signatures file directly, which the
          # protection rejects with "Changes must be made through a pull request".
          # Signatures are bookkeeping, not source, so they live on their own
          # orphan branch — which must stay UNPROTECTED for this to work.
          branch: 'cla-signatures'
          allowlist: 'savvasioakeim,dependabot[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thanks for your pull request! Before we can merge it, please read our [Contributor License Agreement](CLA.md) and sign it by posting the exact comment below.'
