# Build & publish a release when a version tag is pushed (e.g. v0.1.0).
# Uses tauri-action: builds the app, bundles the installers (NSIS on Windows,
# .app/.dmg on macOS for Apple Silicon and Intel), and attaches the artifacts to
# ONE draft GitHub release for manual review before publishing.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OctoShell ${{ github.ref_name }}"
          releaseBody: "See the assets below. Unsigned builds — Windows SmartScreen will warn (More info → Run anyway); macOS Gatekeeper needs right-click → Open, or `xattr -dr com.apple.quarantine OctoShell.app`."
          releaseDraft: true
          prerelease: false

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OctoShell ${{ github.ref_name }}"
          releaseBody: "See the assets below. Unsigned builds — Windows SmartScreen will warn (More info → Run anyway); macOS Gatekeeper needs right-click → Open, or `xattr -dr com.apple.quarantine OctoShell.app`."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
