# Build & publish a Windows release when a version tag is pushed (e.g. v0.1.0).
# Uses tauri-action: builds the app, bundles the NSIS installer, and attaches
# the artifacts to a draft GitHub release for manual review before publishing.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OctoShell ${{ github.ref_name }}"
          releaseBody: "See the assets below. Unsigned build — SmartScreen will warn; click More info → Run anyway."
          releaseDraft: true
          prerelease: false
