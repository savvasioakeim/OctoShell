# Build & publish a release when a version tag is pushed (e.g. v0.1.0).
# Uses tauri-action: builds the app, bundles the installers (NSIS on Windows,
# .app/.dmg on macOS for Apple Silicon), and attaches the artifacts to ONE
# draft GitHub release for manual review before publishing.
#
# The release body is built by scripts/release-notes.mjs: the tag's section
# from CHANGELOG.md, then the install steps. The same file feeds the What's
# new list inside the app, so a release is described once and read in three
# places.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The release notes, from CHANGELOG.md. First step after checkout on
      # purpose: it fails when the tag has no section in the changelog, and a
      # release with no account of what changed is the thing it is here to
      # prevent. Failing now costs seconds; failing after the build costs the
      # build. It runs before setup-node, which is fine: the runner ships with
      # node, and the script uses nothing but the standard library.
      - id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            node scripts/release-notes.mjs "${{ github.ref_name }}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer and emits latest.json, which the in-app updater
          # reads. Without these secrets the build still succeeds -- it just
          # ships nothing the updater will accept, which is the intended
          # failure mode: no signature, no automatic install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OctoShell ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

  # Apple Silicon only. Intel Macs are not built: `fastembed` pulls in ONNX
  # Runtime, which publishes no prebuilt binary for x86_64-apple-darwin, so the
  # build script fails before it reaches our code. Nobody here has an Intel Mac
  # to test on either. The code is public: anyone who wants that build can make
  # it and keep it working on their own machine.
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The release notes, from CHANGELOG.md. First step after checkout on
      # purpose: it fails when the tag has no section in the changelog, and a
      # release with no account of what changed is the thing it is here to
      # prevent. Failing now costs seconds; failing after the build costs the
      # build. It runs before setup-node, which is fine: the runner ships with
      # node, and the script uses nothing but the standard library.
      - id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            node scripts/release-notes.mjs "${{ github.ref_name }}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The macOS builds need the same signing key as the Windows one, or
          # they land in the release with no signature and the in-app updater
          # refuses them: a Mac user would keep downloading by hand forever.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OctoShell ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
